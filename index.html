<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano de Metas e Ações (PMA) 2027 - Painel de Monitoramento</title>
<style>
/* Paleta de Cores Atualizada (Com as suas cores exatas) */
:root{
  --gold:#ce8f33; 
  --goldd:#B07D2C;
  --brown:#632704;
  --brownd:#4A1D03;
  --green:#0f4147;
  --sage:#6a8c6b;
  --bg:#EFECE6;
  --bd:#D3C4B1;
  --r:8px;
  --g:14px;
  --sh:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -1px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:var(--bg);color:#222;padding:14px 20px;min-height:100vh;display:flex;flex-direction:column;gap:var(--g);max-width:1500px;margin:0 auto}

/* Header Limpo */
.bar{background:var(--gold);border:1px solid var(--goldd);color:#fff;border-radius:var(--r);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.logo-header{display:flex;align-items:center;padding:0}
.logo-header img{height:50px; object-fit:contain}
.bar-center{text-align:center;flex:1}
.bar h1{font-size:18px;letter-spacing:.5px;text-transform:uppercase;font-weight:800}
.bar small{display:block;font-size:11px;margin-top:3px;letter-spacing:.5px;opacity:.95;font-weight:600;color:#fff}

/* Botão Home */
.home{background:rgba(0,0,0,.15);border-radius:6px;padding:6px;border:0;cursor:pointer;transition:.2s}
.home:hover{background:rgba(0,0,0,.3)}
.home svg{width:26px;height:26px;fill:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}

/* Layout */
.layout{display:flex;flex-direction:column;gap:var(--g);flex:1}
.main{display:flex;flex-direction:column;gap:var(--g);min-width:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-radius:var(--r);overflow:hidden;border:0;box-shadow:var(--sh)}
.tab{background:var(--brown);color:#fff;border:1px solid var(--bd);border-right:0;padding:11px;font-size:13px;font-weight:700;text-transform:uppercase;cursor:pointer;transition:.2s}
.tab:last-child{border-right:1px solid var(--bd)}.tab.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.tab:hover:not(.on){background:#7d3305}
.view{display:none;flex-direction:column;gap:var(--g)}.view.on{display:flex;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Cards e Elementos */
.card{background:#fff;border:1px solid var(--gold);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px;min-width:0}
.card.g{border:1px solid var(--gold)}
.ct{font-size:13.5px;font-weight:800;text-align:center;text-transform:uppercase;color:#000}
.txt{font-size:12.5px;line-height:1.5;color:#333;text-align:justify}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:var(--g);align-items:stretch}

/* AJUSTE DAS LARGURAS: 1(Normal) : 1.35(Largo) : 0.85(Estreito) */
#v1 .g3-custom{display:grid;grid-template-columns:1fr 1.35fr 0.85fr;gap:var(--g);align-items:stretch;height:540px}
#v1 .g3-custom > div{display:flex;flex-direction:column;height:100%;min-height:0}
#v1 .g3-custom .col-left{gap:var(--g)}
#v1 .g3-custom .col-left > .card{margin:0}
#v1 .g3-custom .col-left > .card:first-child{flex:none}
#v1 .g3-custom .col-left > .card:last-child{flex:1;min-height:0;display:flex;flex-direction:column}
#v1 .g3-custom .col-left > .card:last-child .sc{flex:1;overflow-y:auto;padding-right:4px}

.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--g)}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--g)}
.sub{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sb{background:var(--sage);color:#fff;border:0;padding:9px 4px;font-size:11px;font-weight:700;border-radius:4px;cursor:pointer;text-transform:uppercase;transition:.2s}
.sb:hover,.sb.on{background:var(--green)}
.mcs{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:8px;flex:1}
.mc{padding:10px;border-radius:6px;text-align:center;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;text-transform:uppercase;line-height:1.3;min-height:56px;transition:transform .2s}
.mc:hover{transform:translateY(-2px)}
.tan{background:var(--gold);color:#fff;border:0}.dk{background:var(--bg);color:#000;border:1px solid var(--gold)}
.mc.big{font-size:15px}
.rad{width:100%;max-width:560px;height:auto;margin:0 auto}
.leg{display:flex;justify-content:center;gap:18px;font-size:11px;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px}
.oc{background:var(--sage);border:2px solid var(--sage);border-radius:var(--r);padding:12px 10px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:5px;justify-content:center;transition:.15s;min-height:96px;box-shadow:var(--sh)}
.oc b{font-size:11.5px;color:#fff;text-transform:uppercase}
.oc span{font-size:11px;font-weight:600;line-height:1.25;color:#fff;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.oc:hover,.oc.on{background:var(--green);border-color:var(--green);transform:translateY(-2px)}

.sc{overflow:auto;flex:1;padding-right:4px}
.vis{list-style:none;display:flex;flex-direction:column;gap:9px;font-size:12px;line-height:1.4;color:#333}
.vis li{padding-left:10px;border-left:3px solid var(--green)}.vis b{color:var(--brown)}
.empty{flex:1;border:2px dashed var(--bd);background:#FBF8F2;border-radius:var(--r);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:12px;color:#777;line-height:1.5}
.mt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mt span{background:var(--bg);border:1px solid var(--bd);color:#999;text-align:center;border-radius:4px;padding:6px;font-size:11.5px;font-weight:700}
.il{list-style:none;display:flex;flex-direction:column}
.il li{display:flex;align-items:center;gap:8px;border-bottom:1px dashed var(--bd);padding:7px 2px;font-size:11.5px;cursor:pointer;line-height:1.3;transition:.15s}
.il li:hover{background:#FBF6EE}
.il em{font-style:normal;font-size:10px;color:var(--mut,#777);white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:6px;border-top:2px solid var(--bd);padding-top:10px}
.tot div{border-radius:6px;padding:7px 4px;text-align:center;font-weight:800;font-size:10.5px;color:#fff;text-transform:uppercase;line-height:1.3}
.tot div b{display:block;font-size:17px}

/* KPIs sem hover (Estáticos) */
.kpi{background:#fff;border:2px solid var(--gold);border-radius:6px;box-shadow:var(--sh);text-align:center;padding:0 0 12px;overflow:hidden}
.kpi h4{background:var(--gold);color:#fff;font-size:11px;text-transform:uppercase;padding:7px 6px;margin:0 0 10px}
.kpi b{font-size:26px;font-weight:900;color:#000}.kpi small{font-size:12px;color:#777;font-weight:600}

/* MAPA DE TEMAS (Bolhas Orgânicas Desordenadas e Fixas) */
.tg {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 25px;
    padding: 40px 10px;
}
.tc {
    width: 154px;
    height: 154px;
    border-radius: 50%;
    border: 3px solid;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
    cursor: pointer;
    transition: box-shadow 0.4s ease; /* Removido o transform para não pular */
    gap: 3px;
    box-shadow: var(--sh);
    position: relative;
}

/* Espalhamento orgânico individual para simular bolhas */
.tc:nth-child(1) { margin-top: -30px; margin-left: 10px; }
.tc:nth-child(2) { margin-top: 40px; margin-right: 15px; }
.tc:nth-child(3) { margin-top: -10px; margin-left: -5px; }
.tc:nth-child(4) { margin-top: 50px; margin-left: 20px; }
.tc:nth-child(5) { margin-top: -40px; }
.tc:nth-child(6) { margin-top: 25px; margin-right: 20px; }
.tc:nth-child(7) { margin-top: -20px; margin-left: 15px; }
.tc:nth-child(8) { margin-top: 35px; }
.tc:nth-child(9) { margin-top: -15px; }

.tc:hover {
    box-shadow: 0 12px 20px -5px rgba(0,0,0,0.25);
    z-index: 10;
}

.tc b{color:#000;font-size:10.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.tc span{color:#333;font-size:10.5px;font-weight:600}
.ti{width:45px;height:45px;margin-bottom:6px;flex:none;object-fit:contain}

/* Cores das Bolhas */
.tcv{background:#E1EBE2;border-color:#7A9F82}
.tca{background:#FDF3E1;border-color:#D4A045}
.tcm{background:#F0E6DD;border-color:#8E5A31}
.tct{background:#DCE7E9;border-color:#4A7A82}
.tco{background:#FDF3E1;border-color:#C87A31}
.tcb{background:#dce7e8;border-color:var(--green)} /* Nova cor "Azul/Verde Escuro" da Paleta */
.tc.nd{background:#F4F4F4;border:2px dashed #BBB;color:#999;cursor:default;margin-top:0 !important;transform:none !important}

.back{display:flex;align-items:center;gap:12px}
.btn{background:var(--brown);color:#fff;border:0;padding:8px 14px;font-size:11px;font-weight:700;border-radius:6px;cursor:pointer;text-transform:uppercase;transition:.2s}
.btn:hover{background:#222}
.back h2{font-size:15px;color:#000;text-transform:uppercase}
.tl{display:grid;grid-template-columns:30% 1fr 1fr;gap:8px 10px;align-items:stretch}
.th{font-size:12px;font-weight:800;color:#000;text-transform:uppercase;text-align:center;border-bottom:2px solid var(--gold);padding-bottom:6px}
.nb{background:var(--brown);color:#fff;border-radius:6px;padding:10px;text-align:center;font-size:11px;font-weight:700;line-height:1.3;display:flex;align-items:center;justify-content:center;border:1px solid var(--brown);box-shadow:0 1px 3px rgba(0,0,0,.08);flex-direction:column;gap:3px;cursor:pointer;transition:.15s}
.nb:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.nb em{font-style:normal;font-size:10px;font-weight:600;opacity:.85}
.nb.w{align-items:flex-start;text-align:left}.nb.w b{color:var(--brown)}
.nb[id^="n-d"].sel{background:var(--brownd);box-shadow:0 0 0 3px rgba(99,39,4,.55)}
.nb[id^="n-r"]{background:#F0E6DD;color:#222;border:1px solid var(--bd);border-left:4px solid var(--brown);font-weight:600}
.nb[id^="n-r"].sel{background:#E8D6C3;box-shadow:0 0 0 3px rgba(99,39,4,.55)}
.nb[id^="n-i-"]{background:#fff;color:#222;border:2px solid var(--gold);font-weight:600}
.nb[id^="n-i-"]:hover{background:var(--gold)}.nb[id^="n-i-"].sel{background:#FDF3E1;box-shadow:0 0 0 3px rgba(206,143,51,.55)}
.nb em.z{color:#D9534F;opacity:1}
.nb.none{background:#FFF3F3;border:1px solid #D9534F;color:#D9534F;cursor:default}
.hint{border:2px dashed var(--bd);border-radius:6px;padding:14px;font-size:11px;color:#888;text-align:center;line-height:1.4;background:#FBF8F2}
.dc{display:flex;flex-direction:column;gap:8px}
.card.g .dc{gap:10px}
.dc>.bx:first-child{background:none;color:#000;border-bottom:1px solid var(--bd);border-radius:0;font-weight:800;padding:2px 2px 10px;font-size:11px;text-align:center;line-height:1.3;text-transform:uppercase}
.dc .bx.l{background:var(--bg);color:#222;border:0;border-radius:6px;text-transform:none;font-weight:600;text-align:left;font-size:11.5px;line-height:1.45;padding:10px}
.dc .bx.l b{color:var(--brown)}
.dc .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dc .row .bx{background:#fff;border:1px solid var(--bd);border-radius:6px;color:var(--brown);font-weight:800;padding:10px;font-size:10px;text-align:center;line-height:1.3;text-transform:uppercase}
.dc .row .bx span{display:block;font-size:11.5px;text-transform:none;margin-top:3px;color:#222;font-weight:600}
.dc .row .bx.l{background:var(--bg);border:0;color:#222;font-weight:600}
.dc .bx[style*="background"]{color:#fff;border:0;border-radius:20px;font-weight:800}

/* Rodapé Ajustado */
.ft{background:var(--gold);border:0;border-radius:6px;color:#fff;font-size:11px;font-weight:700;padding:14px 14px;text-align:center}

.tree{position:relative;display:grid;grid-template-columns:repeat(3,1fr);column-gap:46px;align-items:start}
#wires{position:absolute;left:0;top:0;pointer-events:none}#wires path{fill:none;stroke:var(--brown);stroke-width:2}
.tcol{display:flex;flex-direction:column;gap:9px;position:relative;z-index:1}

/* Capa Ajustada */
#cover {position:fixed;inset:0;background:url('capa-pma.jpg') center/cover no-repeat;z-index:9999;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8%;}
#cover button {background:var(--green);color:#fff;border:2px solid #fff;padding:16px 48px;font-size:18px;font-weight:800;border-radius:30px;cursor:pointer;text-transform:uppercase;box-shadow:0 8px 16px rgba(0,0,0,0.3);transition:transform 0.3s, background 0.3s;letter-spacing:1px;}
#cover button:hover {background:var(--gold);transform:translateY(-3px);}

@media(max-width:1100px){.layout,.g2,.g3-custom,.tl{grid-template-columns:1fr}.g5,.g4{grid-template-columns:repeat(2,1fr)}.tg{grid-template-columns:repeat(2,1fr); padding: 20px 10px;} .tc:nth-child(n) {margin-top:0; margin-left:0; margin-right:0;} #v1 .g3-custom{height:auto} #v1 .g3-custom > div {height: auto; max-height: 520px;}}
</style>
<script>window.addEventListener('error',function(e){var m=(e.message||'').replace('Uncaught ','');if(/DATA is not defined/.test(m)){document.body.innerHTML='<div style="font:16px \'Segoe UI\',sans-serif;padding:40px;max-width:640px;margin:auto"><h2>Este arquivo é apenas o modelo</h2><p style="margin-top:10px">Ele não contém os dados. Abra o <b>dashboard_pma_2027.html</b> (ou gere um novo com <code>python gerar_dashboard.py planilha.xlsx template_dashboard.html saida.html</code>).</p></div>'}else{var d=document.createElement('div');d.style.cssText='background:#FFF3F3;border:2px solid #D9534F;color:#8A1F1B;padding:12px 16px;margin:10px 0;border-radius:8px;font:13px \'Segoe UI\',sans-serif';d.textContent='Erro no painel: '+m;document.body.insertBefore(d,document.body.firstChild)}})</script>
</head>
<body>

<!-- CAPA PMA 2027 -->
<div id="cover">
    <button onclick="document.getElementById('cover').style.display='none'">Entrar no Painel</button>
</div>

<!-- CABEÇALHO LIMPO -->
<header class="bar">
    <div class="logo-header">
        <img src="cabecalho.png" alt="PMA 2027 Logo">
    </div>
    <div class="bar-center">
        <h1 id="ttl"></h1>
        <small>IMPLEMENTANDO O PLANO NACIONAL DE MINERAÇÃO 2050</small>
    </div>
    <button class="home" onclick="document.getElementById('cover').style.display='flex'" title="Voltar para a Capa">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </button>
</header>

<div class="layout">
    <div class="main">
        <nav class="tabs"><button class="tab" onclick="go(0)">Plano de Metas</button><button class="tab" onclick="go(1)">Objetivos Estratégicos</button><button class="tab" onclick="go(2)">Mapa de Temas</button></nav>
        <section class="view" id="v0"></section>
        <section class="view" id="v1"></section>
        <section class="view" id="v2"></section>
        <section class="view" id="v3"></section>
    </div>
</div>

<footer class="ft">
    Desenvolvido pela SNGM/MME a partir de dados elaborados no Departamento de Planejamento e Política Mineral - DPPM/MME
</footer>

<script>
const DATA={"oe": [{"id": 1, "nome": "Consolidar a Mineração Brasileira como Sustentável e Inclusiva", "almeja": "“Consolidar a mineração brasileira em uma atividade economicamente estratégica, socialmente inclusiva e ambientalmente responsável, que contribua para o desenvolvimento regional, a geração de empregos e a melhoria da qualidade de vida das comunidades impactadas, integrando práticas de governança, integridade e responsabilidade socioambiental”", "visao": [{"t": "Desenvolvimento local", "d": "Os projetos minerários promovem impactos positivos duradouros nas comunidades, contribuindo para o desenvolvimento local, em alinhamento às políticas públicas e às prioridades sociais."}, {"t": "Geração de empregos e inclusão social", "d": "Os empreendimentos minerários geram mais empregos, contratam localmente e promovem a inclusão social, com a força de trabalho composta de maneira significativa por jovens, mulheres e grupos historicamente sub-representados, fortalecendo a diversidade e o desenvolvimento das regiões impactadas."}, {"t": "Responsabilidade socioambiental", "d": "As operações minerárias, de maneira geral, são reconhecidas por sua sustentabilidade e responsabilidade social, com impactos continuamente monitorados e com comunicação transparente, garantindo benefícios para as comunidades e mitigação efetiva de quaisquer efeitos negativos."}, {"t": "Governança e integridade", "d": "O setor mineral é reconhecido pela excelência em governança, conduzindo projetos com transparência, integridade e ampla participação das comunidades, observando rigorosamente os princípios ESG e prevenindo corrupção e violações socioambientais."}, {"t": "Impacto social e bem-estar", "d": "As comunidades impactadas pela mineração desfrutam de uma qualidade de vida elevada, com amplo acesso à educação, à saúde, ao saneamento e a oportunidades econômicas, como resultado de um desenvolvimento sustentável e inclusivo do setor."}, {"t": "Fechamento de mina e recuperação ambiental", "d": "Os empreendimentos minerários realizam o fechamento de mina de forma responsável, com recuperação ambiental efetiva e uma transição socioeconômica sustentável para as comunidades e regiões impactadas, adotando o fechamento progressivo como prática central da gestão operacional."}, {"t": "Economia circular e gestão de resíduos minerários", "d": "Os empreendimentos minerários adotam práticas de economia circular na gestão de resíduos, implementando sistemas integrados que maximizam o reaproveitamento, minimizam impactos ambientais e promovem a sustentabilidade do setor."}, {"t": "Uso de tecnologias inovadoras habilitadoras", "d": "O setor mineral integra tecnologias digitais avançadas para aprimorar a segurança de estruturas, o monitoramento ambiental e a transparência, promovendo a antecipação e prevenção de riscos e ampliando a legitimidade do setor. Investimentos em capacitação digital, desde a educação básica, fortalecem a inclusão tecnológica das comunidades, garantindo que os benefícios da transformação digital sejam amplamente aproveitados."}, {"t": "Descarbonização e neutralização de emissões residuais de GEE", "d": "O setor mineral opera com baixas emissões de gases de efeito estufa, adotando tecnologias e processos limpos e sustentáveis que contribuem para a mitigação das mudanças climáticas e, quando inevitáveis, para a neutralização das emissões residuais de GEE, principalmente por meio da proteção e restauração da vegetação nativa."}, {"t": "Fortalecimento da mineração de pequeno porte como vetor de inclusão econômica e sustentável", "d": "A grande maioria dos empreendimentos minerários de pequeno porte opera de forma regularizada e sustentável, contribuindo para a economia local."}, {"t": "Segurança Jurídica", "d": "O setor mineral opera com elevada previsibilidade e governança socioambiental, em conformidade com os marcos legais nacionais e compromissos internacionais, em especial a Convenção 169 da OIT, entre outros referenciais aplicáveis, assegurando processos decisórios transparentes e o engajamento adequado das partes interessadas."}, {"t": "Licenciamento Ambiental", "d": "A atividade minerária continua evoluindo em direção a padrões cada vez mais elevados de desempenho ambiental, ampliando o uso de tecnologias, práticas de gestão e soluções inovadoras capazes de reduzir impactos ambientais. Esses avanços tornam-se elementos fundamentais para assegurar a compatibilidade entre o desenvolvimento da atividade mineral e os processos de licenciamento ambiental conduzidos pelos órgãos competentes."}, {"t": "Avaliação de Impacto Ambiental", "d": "A avaliação de impacto ambiental é incorporada de forma mais ampla aos processos de planejamento e tomada de decisão relacionados ao desenvolvimento da atividade minerária. Nesse contexto, o planejamento de prioridades passa a incorporar, de forma crescente, instrumentos de avaliação ambiental em níveis estratégicos e regionais, permitindo considerar de forma mais abrangente impactos cumulativos e especificidades territoriais."}, {"t": "Avaliação e Gestão de Riscos", "d": "O desenvolvimento da atividade minerária incorpora, de forma cada vez mais estruturada, processos de avaliação e gestão de riscos associados às diferentes etapas da atividade mineral. A adoção de práticas avançadas de gestão de riscos contribui para fortalecer a segurança das operações, ampliar a confiança da sociedade na atividade minerária e aprimorar os mecanismos de prevenção e mitigação de impactos socioambientais."}]}, {"id": 2, "nome": "Ampliar o Conhecimento Geológico e o Aproveitamento dos Recursos Minerais", "almeja": "“Ampliar o conhecimento geológico e fortalecer o aproveitamento sustentável dos recursos minerais do Brasil, promovendo a pesquisa mineral, a diversificação da produção nacional e a exploração responsável de minerais críticos e estratégicos, garantindo suporte à economia, à transição energética, à segurança alimentar e ao desenvolvimento socioeconômico e tecnológico nacional e regional, em um cenário de crescimento econômico sustentável e uso eficiente de recursos.”", "visao": [{"t": "Ampliação do conhecimento geológico e de recursos minerais", "d": "O SGB expande o mapeamento geológico na escala 1:100.000, bem como amplia a aquisição de dados por meio da geofísica, de novas tecnologias e da integração com bases de dados da ANM, fornecendo dados públicos précompetitivos. O setor privado amplia sua participação na geração e validação dessas informações, consolidando um ecossistema transparente e acessível que reduz o risco exploratório e atrai novos investimentos para o país."}, {"t": "Aumento da pesquisa mineral", "d": "O setor mineral brasileiro realiza investimentos crescentes e estratégicos em pesquisa mineral, com foco em regiões prioritárias e em minerais críticos e estratégicos, considerando previamente aspectos ambientais, sociais, territoriais e legais, posicionando o país entre os principais destinos de investimentos em pesquisa mineral."}, {"t": "Aproveitamento dos recursos outorgados", "d": "As áreas outorgadas são adequadamente aproveitadas, com foco na produção de minerais de relevância estratégica e de alto potencial de valorização."}, {"t": "Diversificação da produção mineral", "d": "Uma parcela significativa da produção mineral nacional é composta por minerais críticos e estratégicos, diversificando a pauta exportadora do setor quanto ao destino e ao conteúdo e apoiando setores estratégicos da indústria, de energia e da agricultura, fortalecendo a competitividade e a sustentabilidade do país."}, {"t": "Sustentabilidade e governança", "d": "As operações de pesquisa, produção e transformação mineral são conduzidas em conformidade com elevados padrões de sustentabilidade, governança e responsabilidade social, com monitoramento contínuo e comunicação transparente dos resultados, garantindo benefícios para os territórios e para as comunidades."}]}, {"id": 3, "nome": "Promover a Agregação de Valor e o Adensamento Produtivo", "almeja": "“Ampliar a agregação de valor à produção mineral brasileira, promovendo a verticalização, a industrialização, a inovação tecnológica e o adensamento produtivo no território nacional, de modo a fortalecer cadeias produtivas estratégicas, elevar o conteúdo tecnológico das exportações e ampliar a competitividade e a geração de riqueza no país.”", "visao": [{"t": "Consolidação das cadeias produtivas minerais e inserção em cadeias globais de valor", "d": "O Brasil terá consolidado cadeias produtivas minerais mais diversificadas, tecnológicas e integradas, com maior agregação de valor e forte articulação com o sistema nacional de ciência, tecnologia e inovação. O país será reconhecido como fornecedor confiável, competitivo e sustentável de tecnologias, bens de capital, serviços, minerais e produtos minerais de maior valor agregado, especialmente aqueles essenciais à industrialização, à transição energética, à transformação digital e à produção de insumos para a agricultura."}, {"t": "Integração com a indústria nacional", "d": "O setor mineral atua de forma articulada com segmentos industriais estratégicos, como os de energia, fertilizantes, siderurgia, eletromobilidade, defesa e tecnologia. As cadeias produtivas domésticas encontram-se fortalecidas, promovendo sinergias entre a mineração e a indústria nacional."}, {"t": "Aumento do conteúdo tecnológico das exportações", "d": "A pauta exportadora mineral apresenta maior participação de produtos transformados, materiais de alta pureza e insumos industriais de alto valor agregado, elevando a competitividade e a inserção do Brasil em cadeias globais de tecnologia avançada."}, {"t": "Inovação e competitividade", "d": "Os investimentos públicos e privados em pesquisa, desenvolvimento tecnológico e inovação (PD&I) no setor mineral crescem de forma consistente, com integração entre empresas, instituições científicas e tecnológicas, universidades e centros de pesquisa, promovendo ganhos de produtividade e contribuindo para o aumento da competitividade, da sustentabilidade e do desenvolvimento tecnológico estratégico."}, {"t": "Empregos qualificados", "d": "A agregação de valor à produção mineral promove a criação de empregos técnicos, científicos e especializados, incentivando a capacitação profissional e o desenvolvimento de competências avançadas no setor."}, {"t": "Desenvolvimento regional", "d": "O fortalecimento das cadeias produtivas minerais dinamiza polos tecnológicos e industriais nas regiões mineradoras, gerando impactos socioeconômicos duradouros, inclusivos e alinhados ao desenvolvimento local e regional."}]}, {"id": 4, "nome": "Fortalecer a Governança, a Integridade e a Transparência na Mineração", "almeja": "“Fortalecer a governança, a integridade e a transparência do setor mineral brasileiro, promovendo um ambiente regulatório seguro e competitivo, práticas de ESG integradas, fiscalização eficiente e mecanismos de controle para prevenção e combate à mineração ilegal, corrupção e lavagem de dinheiro, assegurando confiança de investidores, proteção dos recursos minerais e fortalecimento da imagem pública do setor.”", "visao": [{"t": "Fortalecimento institucional e regulatório", "d": "A regulação e a fiscalização do setor mineral operam com elevados níveis de eficiência, integridade e transparência, com integração plena de dados e processos, fortalecendo a governança, a confiabilidade e o desempenho regulatório."}, {"t": "Combate à ilegalidade e corrupção", "d": "Os empreendimentos do setor mineral operam de forma plenamente integrada a sistemas digitais de rastreabilidade, georreferenciamento e monitoramento em tempo real, assegurando transparência, integridade e a prevenção efetiva de práticas ilegais, fraudes, corrupção e lavagem de dinheiro."}, {"t": "Transparência e dados abertos", "d": "As informações públicas do setor mineral, incluindo informações sobre concessões, licenças, produção e fiscalização, são plenamente acessíveis, organizadas e integradas em plataformas digitais de fácil consulta, garantindo transparência e amplo acesso aos cidadãos, empresas, pesquisadores e demais interessados."}, {"t": "Consolidação da imagem e comunicação do setor", "d": "O setor mineral conta com confiança e legitimidade perante a sociedade, os investidores, os órgãos públicos e os formadores de opinião, em razão de sua atuação responsável, transparente e comprometida com o desenvolvimento sustentável."}, {"t": "Integração de aspectos ambientais, sociais e de governança e sustentabilidade", "d": "As operações minerárias são conduzidas em conformidade com elevados padrões de governança e responsabilidade socioambiental, com divulgação transparente e auditável de resultados, fortalecendo a confiança no setor."}, {"t": "Coordenação estratégica da política mineral no âmbito do Conselho Nacional de Política Mineral (CNPM)", "d": "O CNPM atua como instância central de articulação estratégica do setor, amparado por uma governança e uma estrutura institucional robustas, promovendo a coordenação efetiva entre órgãos governamentais, entes federativos e demais atores relevantes, de forma a assegurar que as políticas públicas para o setor sejam orientadas por evidências, alinhadas a objetivos de longo prazo e integradas a outras políticas setoriais, como as de energia, indústria, infraestrutura e logística, meio ambiente e clima."}, {"t": "Planejamento, monitoramento e avaliação da política mineral", "d": "O planejamento do setor mineral é orientado por instrumentos de longo prazo, com metas claras, indicadores mensuráveis e mecanismos sistemáticos de monitoramento e avaliação. As políticas públicas são continuamente acompanhadas e ajustadas com base em dados confiáveis e evidências, permitindo maior eficiência na alocação de recursos e na entrega de resultados. Sistemas integrados de informação e painéis de acompanhamento asseguram transparência, previsibilidade e capacidade de resposta, fortalecendo a gestão pública e a tomada de decisão no setor mineral."}]}, {"id": 5, "nome": "Assegurar a Soberania Nacional e a Segurança do Suprimento Mineral", "almeja": "“Assegurar a soberania nacional mineral, garantindo a segurança e a resiliência do suprimento de insumos minerais essenciais ao desenvolvimento socioeconômico e tecnológico, à transição energética, à segurança alimentar e à defesa nacional”", "visao": [{"t": "Domínio do conhecimento e da informação geológica", "d": "O país dispõe de uma base geocientífica ampla, integrada e orientada a decisões estratégicas, garantindo planejamento de longo prazo, decisões informadas e aproveitamento sustentável de seus recursos minerais."}, {"t": "Fortalecimento da soberania nacional nas cadeias minerais estratégicas", "d": "O setor mineral brasileiro fortalece a soberania nacional por meio da ampliação da capacidade de produção e transformação de minerais estratégicos para o país. Esse avanço apoia a transição energética, os processos de descarbonização da economia e o desenvolvimento de cadeias produtivas estratégicas, incluindo aquelas associadas à produção de fertilizantes, reforçando a posição estratégica do Brasil no contexto geopolítico e econômico internacional."}, {"t": "Ambiente regulatório alinhado ao interesse nacional", "d": "O marco regulatório mineral é sólido, previsível e eficiente, equilibrando a atração de investimentos com a proteção do interesse nacional, promovendo confiança e segurança jurídica para todos os atores do setor."}, {"t": "Integração com políticas setoriais industriais, de clima, de energia, de defesa e de segurança alimentar", "d": "A política mineral está articulada às estratégias nacionais de desenvolvimento, contribuindo para a autonomia estratégica do país e fortalecendo a sinergia das ações do Estado Brasileiro, de modo a ampliar a soberania nacional e a competitividade do setor mineral brasileiro."}, {"t": "Combate à mineração ilegal", "d": "Os projetos e a atuação do setor mineral incorporam ações voltadas à prevenção e ao combate à mineração ilegal, incluindo o garimpo ilegal, fortalecendo a governança, garantindo a conformidade com os regimes jurídicos aplicáveis e reduzindo vulnerabilidades socioambientais. Essas ações promovem maior segurança operacional, proteção do território e desenvolvimento sustentável das regiões impactadas, sendo conduzidas de forma articulada com autoridades competentes e comunidades locais, com transparência, monitoramento contínuo e mitigação dos riscos associados a práticas irregulares."}, {"t": "Proteção dos Bens da União", "d": "A segurança do suprimento mineral nacional se apoia na adequada gestão dos bens minerais da União, observando-se o regime constitucional vigente e garantindo previsibilidade e ordenamento no acesso aos recursos."}]}], "dirs": [{"i": 1, "tema": "Responsabilidade Socioambiental", "desafio": "Planejamento e execução responsáveis do fechamento de mina, visando à recuperação ambiental e à construção de um legado social positivo", "txt": "Promover o aprimoramento da regulamentação do fechamento de mina, considerando aspectos relacionados à recuperação ambiental e à inclusão das comunidades no processo.", "ad": {"1": 2, "2": 0, "3": 0, "4": 2, "5": 0}}, {"i": 2, "tema": "Responsabilidade Socioambiental", "desafio": "Planejamento e execução responsáveis do fechamento de mina, visando à recuperação ambiental e à construção de um legado social positivo", "txt": "Promover a adoção de garantias financeiras para assegurar os recursos necessários às ações de recuperação e às etapas de transição socioeconômica nas fases posteriores ao fechamento de mina.", "ad": {"1": 2, "2": 0, "3": 0, "4": 2, "5": 1}}, {"i": 3, "tema": "Responsabilidade Socioambiental", "desafio": "Planejamento e execução responsáveis do fechamento de mina, visando à recuperação ambiental e à construção de um legado social positivo", "txt": "Criar guias nacionais de boas práticas para fechamento de mina voltadas à recuperação ambiental e à transição socioeconômica das áreas impactadas.", "ad": {"1": 2, "2": 0, "3": 0, "4": 2, "5": 0}}, {"i": 4, "tema": "Responsabilidade Socioambiental", "desafio": "Integração dos princípios da economia circular à mineração brasileira", "txt": "Promover ações e abordagens integradas de gestão de resíduos da mineração, que estimulem a redução da geração de resíduos e seu reaproveitamento, considerando princípios da economia circular.", "ad": {"1": 2, "2": 1, "3": 1, "4": 1, "5": 0}}, {"i": 5, "tema": "Responsabilidade Socioambiental", "desafio": "Integração dos princípios da economia circular à mineração brasileira", "txt": "Implementar e estimular ações que aprimorem a segurança de estruturas de mineração, incluindo pilhas de rejeitos, barragens, estoques e outras instalações.", "ad": {"1": 2, "2": 0, "3": 0, "4": 2, "5": 0}}, {"i": 6, "tema": "Responsabilidade Socioambiental", "desafio": "Integração dos princípios da economia circular à mineração brasileira", "txt": "Fomentar o aproveitamento mineral de resíduos urbanos, industriais e tecnológicos por meio de instrumentos regulatórios, econômicos e tecnológicos.", "ad": {"1": 2, "2": 1, "3": 2, "4": 1, "5": 0}}, {"i": 7, "tema": "Responsabilidade Socioambiental", "desafio": "Redução das emissões de carbono e outros gases de efeito estufa (GEE) e aumento da eficiência no uso de recursos naturais nas operações minerárias", "txt": "Implementar políticas de descarbonização da mineração, voltadas à redução das emissões, estimulando a adoção gradual de práticas e tecnologias de menor impacto climático.", "ad": {"1": 2, "2": 0, "3": 0, "4": 2, "5": 0}}, {"i": 8, "tema": "Responsabilidade Socioambiental", "desafio": "Redução das emissões de carbono e outros gases de efeito estufa (GEE) e aumento da eficiência no uso de recursos naturais nas operações minerárias", "txt": "Promover ações que favoreçam a melhoria da eficiência energética nas operações minerárias, com foco no uso racional dos recursos naturais e no aumento da competitividade do setor.", "ad": {"1": 2, "2": 0, "3": 0, "4": 1, "5": 0}}, {"i": 9, "tema": "Responsabilidade Socioambiental", "desafio": "Redução das emissões de carbono e outros gases de efeito estufa (GEE) e aumento da eficiência no uso de recursos naturais nas operações minerárias", "txt": "Estimular a ampliação do reuso e a reciclagem da água no setor mineral, valorizando soluções que aumentem a eficiência hídrica e reduzam a dependência de novas captações.", "ad": {"1": 2, "2": 0, "3": 0, "4": 1, "5": 0}}, {"i": 10, "tema": "Responsabilidade Socioambiental", "desafio": "Ampliar a atuação responsável da mineração no território, especialmente em áreas de maior vulnerabilidade social e ambiental, observados elevados padrões de responsabilidade socioambiental", "txt": "Promover a participação social e o diálogo contínuo com as comunidades impactadas, incluindo povos indígenas, comunidades quilombolas e povos e comunidades tradicionais, observando, quando aplicável, os princípios da Consulta Livre, Prévia e Informada (CLPI).", "ad": {"1": 2, "2": 0, "3": 0, "4": 2, "5": 0}}, {"i": 11, "tema": "Responsabilidade Socioambiental", "desafio": "Ampliar a atuação responsável da mineração no território, especialmente em áreas de maior vulnerabilidade social e ambiental, observados elevados padrões de responsabilidade socioambiental", "txt": "Definir critérios de uso sustentável em Unidades de Conservação de Uso Sustentável, priorizando baixo impacto e monitoramento contínuo.", "ad": {"1": 2, "2": 0, "3": 0, "4": 2, "5": 0}}, {"i": 12, "tema": "Responsabilidade Socioambiental", "desafio": "Ampliar a atuação responsável da mineração no território, especialmente em áreas de maior vulnerabilidade social e ambiental, observados elevados padrões de responsabilidade socioambiental", "txt": "Fomentar programas de governança territorial participativa, estimulando a inclusão comunitária e estratégias integradas de gestão local.", "ad": {"1": 2, "2": 0, "3": 0, "4": 2, "5": 0}}, {"i": 13, "tema": "Responsabilidade Socioambien a identificar estruturas e características geológicas, subsidiar o mapeamento geológico, reconhecer áreas com potencial mineral e reduzir os riscos exploratórios.", "resultado": "Priorizar os métodos de aerolevantamento (magnetometria, gamaespectrometria, gravimetria, eletromagnético) e levantamento terrestre (gravimetria, magnetotelúrico e sísmica passiva), com o objetivo, respectivamente, de contemplar áreas em escala regional  e de detalhe com foco em distritos e províncias minerais, de modo a subsidiar a elaboração de modelos prospectivos e de favorabilidade mineral.", "sit": "Em execução", "sit_obs": null, "unidade": "DGM", "nat": "Ação", "nat_obs": null, "mj": "100", "md": "170", "oeV": 2, "dirs": [26, 27, 58], "temas": ["Conhecimento Geológico e de Recursos Minerais", "Governança Institucional na Mineração"], "ader": 2}, {"id": "PMA-2027-002", "nome": "Levantamentos Geoquímicos", "curto": null, "desc": "O levantamento geoquímico compreende a coleta sistemática de amostras de solos, sedimentos, rochas e águas, seguida de análises laboratoriais. Os dados são interpretados para reconhecer anomalias geoquímicas, identificar áreas com potencial mineral e apoiar a pesquisa mineral, reduzindo riscos exploratórios e ampliando o conhecimento geológico do território.", "resultado": "Priorizar a coleta de dados de geoquímica prospectiva nos levantamentos básicos do SGB, por meio da coleta e análise sistemática de sedimentos de corrente, concentrados de bateia e solos, visando caracterizar a distribuição dos elementos químicos e identificar assinaturas geoquímicas, de forma a ampliar o conhecimento geológico do território nacional e delimitar áreas com potencial para mineração.", "sit": "Em execução", "sit_obs": null, "unidade": "DGM", "nat": "Ação", "nat_obs": null, "mj": "30", "md": "NOVA 99.000 (INFORMADA ANTERIORMENTE 69.000)", "oeV": 2, "dirs": [26, 27, 58], "temas": ["Conhecimento Geológico e de Recursos Minerais", "Governança Institucional na Mineração"], "ader": 2}, {"id": "PMA-2027-003", "nome": "Levantamentos geológicos, geofísicos e oceanográficos marinhos.", "curto": null, "desc": "Levantamentos geológicos, geofísicos e oceanográficos marinhos na Plataforma Continental Jurídica Brasileira (PCJB) em atendimento à Política Nacional para os Recursos do Mar e ao Plano Setorial para Recursos do Mar no âmbito do programa Avaliação da Potencialidade Mineral da Plataforma Continental Jurídica Brasileira.", "resultado": "Realizar expedições oceanográficas, elaborar mapas e relatórios referentes ao substrato da PCJB, visando a exploração dos recursos minerais marinhos, bem como a governança espacial marinha.", "sit": "Em execução", "sit_obs": null, "unidade": "DGM", "nat": "Ação", "nat_obs": null, "mj": "1", "md": "2", "oeV": 2, "dirs": [27, 28, 58], "temas": ["Conhecimento Geológico e de Recursos Minerais", "Governança Institucional na Mineração"], "ader": 2}, {"id": "PMA-2027-004", "nome": "Mapeamento Geológico", "curto": null, "desc": "O mapeamento geológico envolve a compilação de dados, levantamentos de campo, identificação e caracterização de rochas e estruturas geológicas, coleta e análise de amostras e interpretação de informações. Seus resultados são apresentados em mapas e relatórios técnicos que apoiam a pesquisa mineral, reduzem riscos exploratórios e subsidiam a gestão dos recursos hídricos e o ordenamento territorial.", "resultado": "Priorizar as escalas de referência 1:250.000 e 1:100.000 para o mapeamento sistemático, com o objetivo, respectivamente, de contemplar áreas de baixo conhecimento geológico (bacias sedimentares e região Amazônica) e áreas localizadas em distritos e províncias minerais, de modo a subsidiar a elaboração de modelos prospectivos e de favorabilidade mineral.", "sit": "Em execução", "sit_obs": null, "unidade": "DGM", "nat": "Ação", "nat_obs": null, "mj": "21", "md": "81", "oeV": 2, "dirs": [26, 27, 28, 58], "temas": ["Conhecimento Geológico e de Recursos Minerais", "Governança Institucional na Mineração"], "ader": 2}, {"id": "PMA-2027-005", "nome": "Avaliação do Potencial de Minerais Críticos e Estratégicos no Brasil", "curto": null, "desc": "A iniciativa reúne levantamentos geológicos, geoquímicos, geofísicos e estudos de sistemas minerais para avaliar o potencial de lítio, grafita, terras raras, cobre, níquel, estanho e minerais associados. Os resultados incluem mapas de favorabilidade e estudos técnicos de acesso público, orientando a pesquisa mineral e decisões de investimento e planejamento.", "resultado": "Identificar e hierarquizar áreas com potencial para minerais críticos e estratégicos, por meio da integração de dados geocientíficos e da elaboração de modelos prospectivos. Disponibilizar informações que reduzam incertezas exploratórias, orientem investimentos e subsidiem políticas públicas voltadas à diversificação e à segurança do suprimento mineral.", "sit": "Em execução", "sit_obs": null, "unidade": "DGM", "nat": "Não informada", "nat_obs": "Programa", "mj": "2", "md": "4", "oeV": 2, "dirs": [26, 27, 29, 31, 41, 58], "temas": ["Conhecimento Geológico e de Recursos Minerais", "Governança Institucional na Mineração", "Minerais Críticos e Estratégicos para a Transição Energética e para a Segurança Alimentar"], "ader": 2}, {"id": "PMA-2027-006", "nome": "Projeto Fosfato Brasil (Segurança Alimentar)", "curto": null, "desc": "O Projeto Fosfato Brasil realiza estudos geológicos e prospectivos para identificar novas ocorrências e avaliar o potencial de depósitos de fosfato, inclusive em áreas já conhecidas. A produção de dados e estudos técnicos visa orientar pesquisas futuras e contribuir para a redução das incertezas exploratórias associadas a um insumo essencial à produção de fertilizantes.", "resultado": "Identificar e caracterizar áreas favoráveis à ocorrência de fosfato, gerando informações geocientíficas públicas que orientem a pesquisa mineral e a avaliação de depósitos. Contribuir, no longo prazo, para a diversificação das fontes nacionais de matéria-prima para fertilizantes e para a segurança do suprimento da agricultura brasileira.", "sit": "Em execução", "sit_obs": null, "unidade": "DGM", "nat": "Projeto", "nat_obs": null, "mj": "1", "md": "2", "oeV": 2, "dirs": [29, 41, 44, 45, 46, 58], "temas": ["Conhecimento Geológico e de Recursos Minerais", "Governança Institucional na Mineração", "Minerais Críticos e Estratégicos para a Transição Energética e para a Segurança Alimentar"], "ader": 2}, {"id": "PMA-2027-007", "nome": "Projeto avaliação do potencial de urânio no brasil", "curto": null, "desc": "O projeto realiza estudos geológicos e prospectivos em diferentes escalas para avaliar o potencial de urânio no território brasileiro, integrando dados geocientíficos e identificando áreas prioritárias para pesquisa. Os produtos técnicos apoiarão o planejamento público, a ampliação do conhecimento sobre recursos minerais nucleares e a segurança do suprimento energético.", "resultado": "Caracterizar sistemas minerais de urânio, identificar e hierarquizar áreas prospectivas e produzir mapas e estudos técnicos que orientem pesquisas posteriores. Quando houver dados suficientes, avaliar o potencial de recursos não descobertos, fornecendo subsídios ao planejamento estratégico e à segurança do suprimento de combustível nuclear.", "sit": "Em execução", "sit_obs": null, "unidade": "DGM", "nat": "Projeto", "nat_obs": null, "mj": "1", "md": "2", "oeV": 2, "dirs": [26, 27, 29, 48, 58], "temas": ["Conhecimento Geológico e de Recursos Minerais", "Governança Institucional na Mineração", "Minerais Críticos e Estratégicos para a Transição Energética e para a Segurança Alimentar"], "ader": 2}, {"id": "PMA-2027-008", "nome": "Disponibilidade Hídrica do Brasil – Mapas Hidrogeológicos", "curto": null, "desc": "Produção e disponibilização de cartografia hidrogeológica e estudos associados, com SIG e padrões técnicos do SGB, para representar ocorrência, circulação, produtividade e qualidade das águas subterrâneas. Recomenda-se que o tema hidrogeologia acompanhe o mapeamento geológico básico na mesma escala.", "resultado": "Ampliar a cobertura e a padronização da cartografia hidrogeológica, gerando mapas e diagnósticos para gestão das águas subterrâneas e planejamento territorial. É importante que cada folha de geologia básica mapeada seja acompanhada pelo tema hidrogeologia na mesma escala e segundo o padrão normativo do SGB. Essa expansão é uma ação estratégica para ampliar o conhecimento hidrogeológico nacional.", "sit": "Em execução", "sit_obs": null, "unidade": "DHT", "nat": "Projeto", "nat_obs": null, "mj": "1", "md": "2", "oeV": 2, "dirs": [31, 58], "temas": ["Conhecimento Geológico e de Recursos Minerais", "Governança Institucional na Mineração"], "ader": 2}, {"id": "PMA-2027-009", "nome": "Ampliação do monitoramento de dados de nível dos principais aquíferos brasileiros – RIMAS (REDE INTEGRADA DE MONITORAMENTO DAS ÁGUAS SUBTERRÂNEAS) Ampliação do monitoramento de dados de nível dos principais aquíferos brasileiros – RIMAS", "curto": null, "desc": "Ampliação e operação da RIMAS para monitoramento quantitativo (densidade e telemetria) e qualitativo das águas subterrâneas, com geração de séries de nível d’água, histórico da qualidade da água e informações hidrogeológicas dos principais aquíferos. A expansão da RIMAS é uma ação estratégica para ampliar o conhecimento hídrico e apoiar a mineração sustentável.", "resultado": "Ampliar e manter o monitoramento hidrogeológico da RIMAS, gerando dados confiáveis sobre nível e qualidade das águas subterrâneas. A RIMAS, infraestrutura estratégica para o Governo Federal, apoia políticas públicas, segurança hídrica, planejamento territorial e adaptação climática, além de produzir séries históricas de alto valor científico para a gestão sustentável dos aquíferos brasileiros.", "sit": "Em execução", "sit_obs": null, "unidade": "DHT", "nat": "Ação", "nat_obs": null, "mj": "275", "md": "280", "oeV": 2, "dirs": [31, 33, 58], "temas": ["Conhecimento Geológico e de Recursos Minerais", "Governança Institucional na Mineração"], "ader": 2}, {"id": "PMA-2027-010", "nome": "Atlas de Geoquimica Ambiental da Região do Polo de Irrigação do Baixio da Boa Vista - Municípios de Xique- Xique e Itaguaçu da Bahia (Bahia). Atlas geoquímico da região do Baixio da Boa Vista (BA).", "curto": null, "desc": "O atlas irá produzir informações integralizadas e sistematizadas de 52 (cinquenta e dois) elementos químicos avaliados nos sedimentos de corrente ou de fundo dos rios e nos solos e, de 28 (vinte e oito) cátions, 7 (sete) ânions e 4 (quatro) parâmetros físico-químicos\nanalisados nas águas superficiais.", "resultado": "O objetivo é promover o conhecimento da distribuição dos elementos na superfície do terreno, delineando as áreas de baixa e alta concentração e os valores de background, fornecendo subsídios às outras ciências relacionadas ao setor mineral (prospecção e metalogenia), ao meio ambiente e ao desenvolvimento sustentável, tais como: saúde humana e animal, agricultura e planejamento do uso da terra.", "sit": "Em execução", "sit_obs": null, "unidade": "DHT", "nat": "Estudo", "nat_obs": null, "mj": "0", "md": "1", "oeV": 2, "dirs": [31, 58], "temas": ["Conhecimento Geológico e de Recursos Minerais", "Governança Institucional na Mineração"], "ader": 2}, {"id": "PMA-2027-011", "nome": "Levantamento da Geodiversidade da Província Metalogenética de Jacobina (BA)                               Levantamento Geodversidade", "curto": null, "desc": "Os levantamentos da geodiversidade são elaborados a partir de uma análise integrada do meio fíisco, envolvendo o mapemaento das rochas, do relevo, dos solos e do regolito, além do comportamento das águas no ciclo hidrológico, bem como as adequabilidades e restrições para os diversos usos (Ex: mineração, agricultura, ocupação urbana, hídrico subterrâneo e geoturismo).", "resultado": "O objetivo principal dessa iniciativa é planejar, subsidiar e nortear o desenvolvimento sustentável e o ordenamento territorial em áreas estratégicas que passam por notável expansão econômica. Por meio da integração de dados científicos do meio físico, a ação visa fornecer um diagnóstico preciso das adequabilidades e restrições das unidades geologico-ambientais aos gestores publicos.", "sit": "Em execução", "sit_obs": null, "unidade": "DHT", "nat": "Estudo", "nat_obs": null, "mj": "0", "md": "4", "oeV": 2, "dirs": [31, 58], "temas": ["Conhecimento Geológico e de Recursos Minerais", "Governança Institucional na Mineração"], "ader": 2}, {"id": "PMA-2027-012", "nome": "Ampliação da base de dados do Sistema de Informações de Águas Subterrâneas – SIAGAS", "curto": null, "desc": "Ampliação, consistência e disponibilização da base nacional do SIAGAS, com dados georreferenciados de poços e fontes naturais. Os estudos propõem ampliar a base de poços e integrá-la a sistemas de informação voltados à mineração, reforçando o papel do SIAGAS como infraestrutura pública de conhecimento hidrogeológico.", "resultado": "Ampliar e qualificar a base nacional do SIAGAS, alcançando 400 mil poços cadastrados/consistidos até dezembro de 2027 e mantendo o acesso público. A base deve apoiar avaliações hidrogeológicas e gestão integrada previstas no PNRH e fornecer informação territorial relevante. Essa expansão é uma ação estratégica para ampliar a base de poços e o conhecimento hídrico, e apoiar a mineração sustentável.", "sit": "Em execução", "sit_obs": null, "unidade": "DHT", "nat": "Ação", "nat_obs": null, "mj": "397,5", "md": "400", "oeV": 2, "dirs": [31, 33, 58], "temas": ["Conhecimento Geológico e de Recursos Minerais", "Governança Institucional na Mineração"], "ader": 2}, {"id": "PMA-2027-013", "nome": "Análises de Elementos Estratégicos em Amostras Geológicas e em Hidrominerais      Análises de Minerais Críticos em Amostras Hidrominerais e Geológicas", "curto": null, "desc": "A determinação de conteúdos de elementos estratégicos em amostras hidrominerais (Al, Co, Cu, Sn, Fe, Li, Mn, Mo, Ni, K, Si, Ti, V) fortalece o suporte técnico à ANM em suas ações de fiscalização de águas minerais, por meio de quadros comparativos entre a análise da fonte e da água engarrafada. Os resultados de análises de amostras geológicas (P2O5, SiO2, MnO, K2O, Al2O3, Fe2O3, TiO2, Ce, Gd, La, Nd, Pr, Sm, Co, Cu, Mo, Nb, Ni, Rb, Sn), por sua vez, dão subsídios à pesquisa do potencial mineral brasileiro.", "resultado": "As análises de elementos estratégicos em amostras hidrominerais auxiliam no rastreamento da adulteração da água engarrafada em relação à água coletada na fonte, dando subsídios a ações de fiscalização da ANM. No que tange à análise química de elementos estratégicos em amostras geológicas, bem como de minerais estratégicos a partir de lâminas petrográficas e de análises em difratômetro de raios-X, numa forma de atuação conjunta com a DGM, torna-se possível ampliar o conhecimento dos recursos minerais em território brasileiro.", "sit": "Prevista para iniciar em 2027", "sit_obs": null, "unidade": "DIG", "nat": "Projeto", "nat_obs": "Embora a Rede LAMIN disponha de infraestrutura analítica e de uma base metodológica consolidada para a execução de seu portfólio de serviços, sua atuação é continuamente adaptada às novas demandas e às oportunidades de participação em diferentes projetos. Entretanto, no que se refere à ampliação e ao fortalecimento da capacidade analítica voltada aos minerais críticos, ainda não foram desenvolvidos projetos específicos direcionados aos objetivos aqui propostos.", "mj": "10", "md": "20", "oeV": 2, "dirs": [26, 40, 58, 61, 69], "temas": ["Ambiente Regulatório e Oportunidades de Mercado", "Conhecimento Geológico e de Recursos Minerais", "Governança Institucional na Mineração", "Pesquisa Mineral e Desenvolvimento da Produção"], "ader": 2}, {"id": "PMA-2027-014", "nome": "Ação de difusão do conhecimento geocientífico                                                          Ação Educativa sobre minerais estratégicos do Brasil", "curto": null, "desc": "Realização de oficinas de fósseis com crianças dos ensinos fundamental I, fundamental II e médio de escolas públicas brasileiras, além de palestras e cursos de formação para professores através do SGBeduca (DERID), e, no caso no MCTer, realização de exposições itinerantes e atividades inerentes pelo país, visto que o museu estará fechado para obras em 2027.", "resultado": "O objetivo geral é disseminar o conhecimento geocientífico, missão do SGB. São objetivos específicos: conscientizar o público em geral (principalmente crianças, jovens, adultos e professores) sobre as geociências e como elas impactam o mundo ao seu redor, usando linguagem cidadã; divulgar o SGB; divulgar e comemorar os 120 anos do MCTer; e contribuir para que o Brasil cumpra com ODSs assumidos.", "sit": "Em execução", "sit_obs": "Atendimento a alunos dos ensinos fundamental I, fundamental II e médio de escolas públicas distribuídas em vários municípios do Brasil e cursos de reciclagem de professores voltados ao ensino das geociências, além de atendimento à população em geral a partir de exposições do acervo e atividades museológicas, organização de oficinas e atividades educativas.", "unidade": "DIG", "nat": "Ação", "nat_obs": null, "mj": "Museu: 2 exposições; DERID (SGBeduca): 150 escolas atendidas. TOTAL (MCTER + DERID) = 152", "md": "Museu: 4 exposições; DERID (SGBeduca): 300 escolas atendidas. TOTAL (MCTER + DERID) = 304", "oeV": 4, "dirs": [74], "temas": ["Imagem e Comunicação Institucional"], "ader": 2}, {"id": "PMA-2027-015", "nome": "Educação e comunicação sobre minerais estratégicos", "curto": null, "desc": "Produção e divulgação de duas cartilhas para a educação básica e de dois textos para o portal SGBeduca sobre nióbio e elementos de terras raras, respectivamente, traduzindo conhecimento geocientífico em linguagem acessível.", "resultado": "A iniciativa busca esclarecer o público infanto-juvenil sobre as geociências e o uso consciente de recursos minerais através da publicação de 01 cartilha para o Ensino Fundamental I (\"Os Minerais e a Minha Casa\") e 01 cartilha (\"O que vem da nossa Terra, Move a nossa vida\") para o Fundamental II e Médio, elaboradas pelo SGBeduca junto com o DDSM/MME, e 02 textos sobre Nb e ETR no site do SGBeduca.", "sit": "Em execução", "sit_obs": "Iniciativa em desenvolvimento pelo SGBeduca, com conteúdos geocientíficos, em linguagem cidadã, em elaboração, revisão técnica e articulação institucional para publicação em 2027. A cartilha \"Os Minerais e a Minha Casa\" foi elaborada em 2026, mas sua publicação está marcada apenas para 2027.", "unidade": "DIG", "nat": "Ação", "nat_obs": "educativa e de conscientização.", "mj": "1", "md": "4", "oeV": 4, "dirs": [58, 74], "temas": ["Governança Institucional na Mineração", "Imagem e Comunicação Institucional"], "ader": 2}, {"id": "PMA-2027-016", "nome": "OpenData - Portal de Dados Abertos do SGB", "curto": null, "desc": "A plataforma hospeda metadados (informações que descrevem a origem, a composição e fornecem dados indexados do método de coleta e a localização espacial de um dado). A conectividade dessa plataforma com a Infraestrutura de Dados Espaciais (INDE) que é mantida e organizada pelo IBGE, permitirá que nossos bancos de dados temáticos se integrem com outro bancos de dados que seguem o mesmo padrão.", "resultado": "Essa plataforma, devidamente indexada e conetada a outros bancos de dados que seguem o mesmo padrão, facilitará a busca, coleta e disponibilização de todo e qualquer dado do acervo do SGB através de busca espacial ou busca aos metadados que estarão preservados no padrão OGC, permitindo que diferentes bancos de dados de mapas temáticos que utilizam mesmo padrão interajam de forma aberta.", "sit": "Outro", "sit_obs": "Outro - Estamos em desenvolvimento da plataforma de Opendata (Portal de Dados Abertos do SGB), construído utilizando o GeoNode como sua plataforma principal de gerenciamento de dados geoespaciais, integrado ao GeoServer, que gerencia, compartilha e publica dados geográficos utilizando os padrões abertos do OGC (Open Geospatial Consortium - Consórcio Geoespacial Aberto), usados por vários organismos.", "unidade": "DIG", "nat": "Projeto", "nat_obs": "Projeto de execução contínua.", "mj": "0", "md": "1", "oeV": 4, "dirs": [26, 33, 58], "temas": ["Conhecimento Geológico e de Recursos Minerais", "Governança Institucional na Mineração"], "ader": 2}, {"id": "PMA-2027-017", "nome": "Cartilha Juvenil", "curto": null, "desc": "Elaboração de Cartilha sobre Mineração destinada ao público juvenil.", "resultado": "A cartilha será elaborada em parceria com o SGBEduca, destinada ao público juvenil, sendo material paradidático que visa a divulgação e conscientização da importância da atividade minerária e as medidas de sustentabilidade desenvolvidas pelo setor.", "sit": "Em validação", "sit_obs": null, "unidade": "DDSM", "nat": "Não informada", "nat_obs": "Outro - Material de Divulgação", "mj": null, "md": null, "oeV": 1, "dirs": [74], "temas": ["Imagem e Comunicação Institucional"], "ader": 2}, {"id": "PMA-2027-018", "nome": "Grupo de Trabalho - GT para proposição de um Programa Nacional de Redução e Reaproveitamento de Rejeitos da Mineração - PNRRM.", "curto": null, "desc": "Grupo de Trabalho - GT para proposição de um Programa Nacional de Redução e Reaproveitamento de Rejeitos da Mineração - PNRRM, instituído pela Resolução nº 3, de 3 de julho de 2026, do Conselho Nacional de Política Mineral - CNPM.", "resultado": "Ao GT compete implementar agenda de trabalho voltada à reciclagem, reaproveitamento e redução de rejeitos da mineração, por meio de ações voltadas à reabilitação de terras degradadas; a alternativas de uso e disposição de estéreis/rejeitos e a avaliação de possibilidade de aprimoramento regulatório, visando a proposição de Programa Nacional de Redução e Reaproveitamento de Rejeitos da Mineração.", "sit": "Em validação", "sit_obs": null, "unidade": "DDSM", "nat": "Ação", "nat_obs": null, "mj": null, "md": null, "oeV": 1, "dirs": [4], "temas": ["Responsabilidade Socioambiental"], "ader": 2}, {"id": "PMA-2027-019", "nome": "Plano de Ação Nacional para a Mineração", "curto": "Artesanal e em Pequena Escala – PAN-MAPE de Ouro", "desc": "Coordenação e elaboração do Plano de Ação Nacional para mineração artesanal e em pequena escala -PAN- MAPE de Ouro, sendo instrumento que contém medidas de governança, formalização e eliminação do uso de mercúrio na MAPE, em articulação com outros competentes e parceiros.", "resultado": "Implementar as estratégias da Convenção de Minamata voltadas à eliminação do uso de mercúrio na MAPE de ouro, protegendo a saúde humana e o meio ambiente. Em 2027, iniciar o primeiro ciclo do PAN, estruturando a execução, o monitoramento e as linhas de base e promovendo a transição da MAPE para práticas sem mercúrio.", "sit": "Em validação", "sit_obs": null, "unidade": "DDSM", "nat": "Projeto", "nat_obs": null, "mj": null, "md": "30% das ações trienais iniciais implementadas", "oeV": 1, "dirs": [21, 22, 23, 24, 25], "temas": ["Mineração com Valor Social"], "ader": 2}, {"id": "PMA-2027-020", "nome": "Prêmio Municípios Mineradores  - Prêmio MM.", "curto": null, "desc": "Realização do Prêmio Municípios Mineradores", "resultado": "O Prêmio Municípios Mineradores (PMM) é uma iniciativa voltada ao reconhecimento e difusão de boas práticas de governança pública em municípios com atividade de mineração, realizado em parceria com AGENDA PÚBLICA por meio de ACT com o MME.", "sit": "Em validação", "sit_obs": null, "unidade": "DDSM", "nat": "Evento", "nat_obs": null, "mj": null, "md": null, "oeV": 1, "dirs": [19, 20, 55], "temas": ["Governança Institucional na Mineração", "Mineração com Valor Social"], "ader": 2}, {"id": "PMA-2027-021", "nome": "Elaboração e aperfeiçoamento dos critérios técnicos para Indústrias Extrativas (CNAE B) na Taxonomia Sustentável Brasileira (TSB)", "curto": null, "desc": "Coordenação do GT CNAE B e elaboração de critérios técnicos para classificar atividades extrativas na TSB.", "resultado": "Estabelecer critérios técnicos claros, verificáveis e adequados às características da indústria extrativa, para identificar contribuições substanciais aos objetivos da TSB, prevenir prejuízos significativos aos demais objetivos e observar salvaguardas mínimas, orientando investimentos para atividades e projetos sustentáveis e a transição do setor mineral.", "sit": "Em validação", "sit_obs": null, "unidade": "DDSM", "nat": "Regulação/Normativo", "nat_obs": null, "mj": null, "md": null, "oeV": 1, "dirs": [4, 7, 9, 13, 14, 59, 60], "temas": ["Governança Institucional na Mineração", "Responsabilidade Socioambiental"], "ader": 2}, {"id": "PMA-2027-022", "nome": "Execução do Ato Normativo Processos de Outorga", "curto": null, "desc": "Ato Normativo que estabelece procedimentos para a análise processual, a priorização e a transparência ativa nos processos de outorga de direitos minerários no âmbito do Ministério de Minas e Energia, e dá outras providências.", "resultado": "Regulamentar a priorização de análise processual e aumentar os níveis de transparência nos processos de concessão de outorga de títulos minerários. Bem como implementar medida de transparência ativa com sistema informatizado de consolidação de dados de concessão de outorga de título minerário.", "sit": "Em fase de estruturação/planejamento", "sit_obs": null, "unidade": "DGPM", "nat": "Regulação/Normativo", "nat_obs": null, "mj": null, "md": null, "oeV": 4, "dirs": [64], "temas": ["Governança Institucional na Mineração"], "ader": 2}, {"id": "PMA-2027-023", "nome": "Atos de Outorga MME", "curto": null, "desc": "A iniciativa diz respeito aos atos de outorga de portaria de lavra de minerais metálicos, insumos agrícolas, água mineral, gemas, diamantes, minerais industriais e energéticos publicados no âmbito deste MME.", "resultado": "Garantir a emissão tempestiva dos atos de outorga de substâncias de competência do Ministério de Minas e Energia", statísticas atualizadas e acessíveis, subsidiando a formulação, o acompanhamento e a avaliação de políticas públicas, o planejamento estratégico e a tomada de decisões pelos diferentes agentes do setor.", "sit": "Prevista para iniciar em 2027", "sit_obs": null, "unidade": "DTTM", "nat": "Ação", "nat_obs": null, "mj": null, "md": null, "oeV": 4, "dirs": [57, 77], "temas": ["Governança Institucional na Mineração", "Imagem e Comunicação Institucional"], "ader": 1}, {"id": "PMA-2027-027", "nome": "Aproveitamento dos resíduos de carvão mineral para conversão em enxofre", "curto": null, "desc": "A iniciativa trata de estudar a viabilidade do aproveitamento dos depósitos de resíduos de carvão mineral do estado de Santa Catarina, que hoje é um passivo ambiental gerido pelo governo federal, para sua conversão em enxofre, insumo fundamental para a produção de fertilizantes fosfatados no país.", "resultado": "Avaliar a viabilidade do aproveitamento dos depósitos dos resíduos de carvão mineral da bacia carbonífera do estado de Santa Catarina para sua conversão em enxofre, insumo fundamental na cadeia de fertilizantes fosfatados.", "sit": "Em fase de estruturação/planejamento", "sit_obs": null, "unidade": "DTTM", "nat": "Estudo", "nat_obs": null, "mj": null, "md": null, "oeV": 3, "dirs": [4, 6, 46], "temas": ["Minerais Críticos e Estratégicos para a Transição Energética e para a Segurança Alimentar", "Responsabilidade Socioambiental"], "ader": 2}, {"id": "PMA-2027-028", "nome": "Áreas Estratégicas para empreendimentos de MCEs", "curto": null, "desc": "Elaboração do regulamento que instituirá as áreas estratégicas previstas no inciso II do art. 29 da Lei 15.506/2026, possibilitando que empreendimentos de beneficiamento e downstream possam fazer parte do Cadastro Nacional de Projetos de Minerais Críticos e Estratégicos (CNPMCE).", "resultado": "Propor áreas estratégicas para a implementação de empreendimentos de minerais críticos e estratégicos.", "sit": "Prevista para iniciar em 2027", "sit_obs": null, "unidade": "DTTM", "nat": "Regulação/Normativo", "nat_obs": null, "mj": null, "md": null, "oeV": 2, "dirs": [53], "temas": ["Tecnologia e Agregação de Valor para o Setor Mineral"], "ader": 0}, {"id": "PMA-2027-029", "nome": "Instituição do Comitê de Barragens e Pilhas de Mineração", "curto": null, "desc": "O comitê de Barragens e Pilhas de Mineração - CBPMin visa atualizar e ampliar o escopo de atuação do antigo Cômite de Barragens de Mineração - CTBMin, contemplando a atualização dos temas relacionados às barragens e incorporando a temática das pilhas de mineração, em razão da importância dessa estrutura no contexto da mineração.", "resultado": "Sugerir políticas públicas e iniciativas para melhorar e robustecer a segurança das estruturas de mineração no país, a partir dos encaminhamentos obtidos das discussões empreendidas no âmbito do CBPMin.", "sit": "Em execução", "sit_obs": null, "unidade": "DTTM", "nat": "Articulação", "nat_obs": null, "mj": null, "md": null, "oeV": 1, "dirs": [5], "temas": ["Responsabilidade Socioambiental"], "ader": 2}, {"id": "PMA-2027-030", "nome": "Decreto de Segurança de Barragens", "curto": null, "desc": "O referido decreto regulamenta os artigos 18-A e 18-B da Lei nº 12.334/2010, que trata da vedação da implantação de barragem de mineração, cujos estudos de ruptura identifiquem existência de comunidade na ZAS e da criação, pelos órgãos fiscalizadores, de sistema de credenciamento de pessoas físicas e jurídicas habilitadas a atestar a segurança da barragem, respectivamente.", "resultado": "Regulamentar dispositivos da Lei nº 12.334/2010", "sit": "Em execução", "sit_obs": null, "unidade": "DTTM", "nat": "Articulação", "nat_obs": null, "mj": null, "md": null, "oeV": 1, "dirs": [5], "temas": ["Responsabilidade Socioambiental"], "ader": 2}, {"id": "PMA-2027-031", "nome": "Elaboração de Diretrizes para Identificação de Subtemas Prioritários de Pesquisa, Desenvolvimento e Inovação em Minerais Críticos e Estratégicos", "curto": null, "desc": "Elaboração de proposta de direcionamentos técnicos para identificação e detalhamento de subtemas prioritários de pesquisa, desenvolvimento e inovação (PD&I) no setor de minerais críticos e estratégicos, considerando as áreas temáticas previstas no art. 36 da Lei nº 15.506/2026 e a possibilidade de inclusão de temas adicionais em regulamento.", "resultado": "Subsidiar a definição de subtemas prioritários de PD&I no âmbito da PNMCE, mediante a proposição de orientações técnicas que considerem as necessidades tecnológicas e os desafios estratégicos do setor mineral, contribuindo para o desenvolvimento da inovação, a agregação de valor em território nacional e o fortalecimento das cadeias produtivas de minerais críticos e estratégicos.", "sit": "Prevista para iniciar em 2027", "sit_obs": null, "unidade": "DTTM", "nat": "Regulação/Normativo", "nat_obs": null, "mj": null, "md": null, "oeV": 3, "dirs": [50, 51, 52], "temas": ["Tecnologia e Agregação de Valor para o Setor Mineral"], "ader": 2}, {"id": "PMA-2027-032", "nome": "Estratégia Nacional de Minerais Críticos e Estratégicos", "curto": null, "desc": "A ENMCE busca direcionar de forma mais assertiva a PNMCE, definindo princípios, objetivos, prioridades, metas e monitoramento para a consecução dos objetivos da Política.", "resultado": "Indicar a aplicação de recursos públicos, alinhar iniciativas dos diferentes níveis de governo, orientar responsabilidades e fortalecer o diálogo entre os atores ligados a MCEs.", "sit": "Em execução", "sit_obs": "Em execução estudo de apoio para a elaboração da Estratégia.", "unidade": "DTTM", "nat": "Estudo", "nat_obs": null, "mj": null, "md": null, "oeV": 3, "dirs": [55, 56], "temas": ["Governança Institucional na Mineração"], "ader": 0}, {"id": "PMA-2027-033", "nome": "Atualização e Divulgação do Guia para Investidores Estrangeiros em Minerais Críticos do Brasil", "curto": null, "desc": "Atualização e divulgação do Guia para Investidores Estrangeiros em Minerais Críticos do Brasil, reunindo informações estratégicas sobre o potencial mineral brasileiro, oportunidades de investimento, projetos minerais, infraestrutura, ambiente regulatório e condições de mercado, com vistas à promoção internacional do setor e ao fortalecimento das cadeias produtivas nacionais.", "resultado": "Promover o potencial mineral brasileiro e ampliar a visibilidade das oportunidades de investimento no país, mediante a disponibilização de informações estratégicas e atualizadas, contribuindo para a atração de investimentos, o fortalecimento da segurança jurídica, a agregação de valor à produção mineral nacional e a inserção competitiva do Brasil nas cadeias globais de valor.", "sit": "Em execução", "sit_obs": null, "unidade": "DTTM", "nat": "Não informada", "nat_obs": "Outro - A proposta destaca a atuação institucional do Ministério de Minas e Energia e a contribuição do Guia para a divulgação das vantagens competitivas do Brasil. Também preserva o alinhamento à estratégia de atração de investimentos que favoreçam a transformação mineral, a inovação tecnológica e a agregação de valor em território nacional.", "mj": null, "md": null, "oeV": 3, "dirs": [45, 53, 57, 66, 77], "temas": ["Ambiente Regulatório e Oportunidades de Mercado", "Governança Institucional na Mineração", "Imagem e Comunicação Institucional", "Minerais Críticos e Estratégicos para a Transição Energética e para a Segurança Alimentar", "Tecnologia e Agregação de Valor para o Setor Mineral"], "ader": 2}, {"id": "PMA-2027-034", "nome": "Articulação e Estruturação de Parcerias para Projetos de Minerais Críticos e Estratégicos no Âmbito do PPI", "curto": null, "desc": "Articulação com o PPI/PR para elaboração de propostas de parcerias voltadas a projetos de pesquisa, lavra, beneficiamento, transformação mineral e mineração urbana de minerais críticos e estratégicos, incluindo infraestruturas associadas, nos termos do art. 48 da Lei nº 15.506/2026, visando ao desenvolvimento sustentável e ao fortalecimento das cadeias produtivas minerais nacionais.", "resultado": "Promover, em articulação com o PPI/PR, a estruturação de propostas de parcerias para projetos de minerais críticos e estratégicos, visando ampliar oportunidades de investimento, estimular a agregação de valor em território nacional, fortalecer as cadeias produtivas minerais e contribuir para a implementação da Política Nacional de Minerais Críticos e Estratégicos.", "sit": "Prevista para iniciar em 2027", "sit_obs": null, "unidade": "DTTM", "nat": "Articulação", "nat_obs": null, "mj": null, "md": null, "oeV": 3, "dirs": [53, 56, 67, 72], "temas": ["Ambiente Regulatório e Oportunidades de Mercado", "Governança Institucional na Mineração", "Tecnologia e Agregação de Valor para o Setor Mineral"], "ader": 2}, {"id": "PMA-2027-035", "nome": "Elaboração da Portaria que regulamenta a aplicação do REIDI aos projetos de minerais críticos e estratégicos", "curto": null, "desc": "Com a sanção da Lei 15.506, de 16 de setembro de 2026, que alterou o art. 2º da Lei 11.488, de 15 de junho de 2007, torna-se necessário a publicação de uma portaria com  a regulamentação complementar para que o projeto seja aprovado pelo Ministério.", "resultado": "Estabelcer as regras e procedimentros para habilitar projetos no REIDI. O que irá possibilitar a redução dos custos de investimentos (CAPEX) em projetos de minerais críticos e estratégicos através da suspenção/isenção de tributos.", "sit": "Prevista para iniciar em 2027", "sit_obs": null, "unidade": "DTTM", "nat": "Regulação/Normativo", "nat_obs": null, "mj": null, "md": null, "oeV": 3, "dirs": [42], "temas": ["Minerais Críticos e Estratégicos para a Transição Energética e para a Segurança Alimentar"], "ader": 0}, {"id": "PMA-2027-036", "nome": "Sistema de acompanhamento e avaliação do PFMCE", "curto": null, "desc": "Elaboração de sistema avaliativo que permita identificar a consecução dos objetivos da PNMCE no tocante ao benefício fiscal previsto pelo art. 17 da Lei 15.506, de 16 de setembro de 2026.", "resultado": "Desenvolver o sistema de acompanhamento e monitoramento da execução do PFMCE, indicando pré-requisitos, estrutura de dados e de gestão", "sit": "Prevista para iniciar em 2028", "sit_obs": null, "unidade": "DTTM", "nat": "Não informada", "nat_obs": "Outro- Sistema de monitoramento", "mj": null, "md": null, "oeV": 4, "dirs": [57], "temas": ["Governança Institucional na Mineração"], "ader": 1}, {"id": "PMA-2027-037", "nome": "CFEM Conecta", "curto": null, "desc": "Programa que moderniza a arrecadação, a distribuição e a transparência da CFEM na PGRM: novo módulo de arrecadação com rastreabilidade (novo boleto integrado à DIEF-CFEM), distribuição automatizada a produtores, afetados e limítrofes, novo marco regulatório (Res. ANM 143/2023) e Portal da Transparência da CFEM para municípios e sociedade.", "resultado": "Dar rastreabilidade e transparência de ponta a ponta à CFEM (da mineradora ao município), automatizar 100% o cálculo da distribuição, reduzir o prazo de repasse aos afetados de ~180 para 30 dias e reduzir em 70% os litígios sobre a metodologia, ampliando transparência, previsibilidade e segurança jurídica aos entes beneficiários.", "sit": "Em execução", "sit_obs": null, "unidade": "SAR / GEPRE", "nat": "Não informada", "nat_obs": "Programa", "mj": "80% da CFEM Total", "md": "90% da CFEM Total", "oeV": 4, "dirs": [16, 20, 57, 62, 63], "temas": ["Governança Institucional na Mineração", "Mineração com Valor Social"], "ader": 2}, {"id": "PMA-2027-038", "nome": "Outorgas de títulos requerimentos de pesquisa automatizadas", "curto": null, "desc": "Mede o percentual de requerimentos de títulos minerários decididos integralmente nos sistemas da ANM (REPEM, RELIC, REPLG e RELAV) em relação ao total protocolado neles. Reflete a expansão da automação na análise e decisão desses requerimentos, com modernização e integração de sistemas como SIGÁreas e SOPLE.", "resultado": "Ampliar progressivamente a automação na análise e decisão de requerimentos de títulos minerários, automatizando etapas críticas, como a verificação de prioridade e a detecção de interferências entre áreas, para reduzir prazos e tornar o processo de outorga mais ágil, preciso e transparente.", "sit": "Em execução", "sit_obs": null, "unidade": "Superintedência de Outorga de Títulos Minerários", "nat": "Ação", "nat_obs": null, "mj": "40% dias", "md": "40% dias", "oeV": 4, "dirs": [33, 66], "temas": ["Ambiente Regulatório e Oportunidades de Mercado", "Conhecimento Geológico e de Recursos Minerais"], "ader": 2}, {"id": "PMA-2027-039", "nome": "Dias reduzidos no tempo médio de análise de requirimento de lavra", "curto": null, "desc": "Mede a redução, em dias, do tempo médio de análise dos requerimentos de lavra, contado da apresentação do relatório final de pesquisa até a publicação da portaria de outorga da concessão. É calculado pela diferença entre o tempo médio dos últimos 10 anos e o tempo médio do ano de apuração (R = TM - TAn). Quanto maior o valor, melhor o desempenho.", "resultado": "Reduzir o tempo médio de análise dos requerimentos de lavra, da apresentação do relatório final de pesquisa até a outorga da concessão, conferindo maior eficiência, celeridade e previsibilidade ao processo de outorga mineral.", "sit": "Em execução", "sit_obs": null, "unidade": "Superintedência de Outorga de Títulos Minerários", "nat": "Ação", "nat_obs": null, "mj": "800 dias", "md": "800 dias", "oeV": 4, "dirs": [66], "temas": ["Ambiente Regulatório e Oportunidades de Mercado"], "ader": 2}, {"id": "PMA-2027-040", "nome": "Sistema Integrado de Gestão de Barragens de Mineração 2.0 (SIGBM 2.0)", "curto": null, "desc": "O SIGBM 2.0 será uma versão mais responsiva do sistema, com arquitetura Clean, que separa responsabilidades do código e facilita testes e manutenção. Terá API para comunicação e desacoplamento de funções, trazendo mais dinamismo, gestão e usabilidade. Com inteligência artificial, permitirá atuação mais integrada e re function radar(){
 const n=5,cx=260,cy=180,R=112,ang=k=>-Math.PI/2+2*Math.PI*k/n,pt=(k,r)=>[cx+r*Math.cos(ang(k)),cy+r*Math.sin(ang(k))];
 const mx=100;
 const lbls = ['Sustentável e Inclusiva', 'Conhecimento Geológico', 'Agregação de Valor', 'Governança e Integridade', 'Soberania e Suprimento'];
 const series = [
   { c: '#7A7A7A', v: [80, 59, 34, 97, 57], n: 'PNM 2050' },
   { c: '#ce8f33', v: [39.80, 42.80, 21.60, 54.30, 34.50], n: 'Geral' },
   { c: '#6a8c6b', v: [9.20, 3.20, 1.23, 12.97, 1.27], n: 'ANM' },
   { c: '#632704', v: [19.87, 12.61, 13.06, 23.83, 18.59], n: 'MME' },
   { c: '#0f4147', v: [10.75, 27.00, 7.32, 17.53, 14.63], n: 'SGB' }
 ];
 let s='';
 for(let g=1;g<=4;g++){s+=`<polygon points="${[0,1,2,3,4].map(k=>pt(k,R*g/4).join(',')).join(' ')}" fill="none" stroke="#E0D0B0"/><text x="${cx+4}" y="${cy-R*g/4+3}" font-size="8" fill="#999">${Math.round(mx*g/4)}</text>`}
 lbls.forEach((lbl,k)=>{const[x,y]=pt(k,R),[lx,ly]=pt(k,R+22),c=Math.cos(ang(k));
  s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E0D0B0"/><text x="${lx}" y="${ly+4}" font-size="10" font-weight="700" fill="#333" text-anchor="${Math.abs(c)<.2?'middle':c>0?'start':'end'}">${lbl}</text>`});
 series.forEach(ds=>{
  s+=`<polygon points="${ds.v.map((v,k)=>pt(k,R*v/mx).join(',')).join(' ')}" fill="${ds.c}" fill-opacity=".16" stroke="${ds.c}" stroke-width="2"/>`;
  ds.v.forEach((v,k)=>{const[px,py]=pt(k,R*v/mx);s+=`<circle cx="${px}" cy="${py}" r="3.5" fill="${ds.c}"><title>${ds.n}: ${v}</title></circle>`})});
 $('rad').innerHTML=s}
